<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Page</title>
  <style>
    :root {
      --accent: blue;
      --page: #f4f5f8;
      --card: #ffffff;
      --text: #202331;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--page);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 12px 40px rgba(25, 30, 50, .09);
    }

    .tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 12%, white);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    h1 { margin: 16px 0 8px; font-size: clamp(28px, 6vw, 38px); }
    p { color: #687083; margin: 0 0 22px; }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { filter: brightness(.94); }
    button:focus-visible { outline: 3px solid #aaa6ff; outline-offset: 3px; }

    .count { margin: 18px 0 0; color: var(--text); font-weight: 600; }
    .footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid #eceef3; color: #9298a7; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">One-file test site</span>
    <h1 id="heading">Hello, world.</h1>
    <p id="description">A tiny page you can edit to test HTML, CSS, and JavaScript changes. Everything lives in this one file.</p>

    <button id="changeButton" type="button">Test a change</button>
    <div class="count" id="count" aria-live="polite">Button clicks: 0</div>

    <div class="footer">Edit <code>index.html</code>, save, and refresh your browser.</div>
  </main>

  <script>
    const button = document.querySelector("#changeButton");
    const heading = document.querySelector("#heading");
    const countLabel = document.querySelector("#count");
    let clicks = 0;

    button.addEventListener("click", () => {
      clicks += 1;
      heading.textContent = clicks % 2
        ? "Nice — your change works!"
        : "Hello, world.";
      countLabel.textContent = `Button clicks: ${clicks}`;
    });
  </script>
</body>
</html>
